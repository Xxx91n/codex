# fork-only workflow: build tri-wire test binaries for Windows/macOS/Linux and
# publish one public rolling prerelease with per-OS assets. NOT upstream-shipped.
name: fork-cli-test-release
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: codex-win-x86_64-pc-windows-msvc.zip
            bin: codex.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: codex-linux-x86_64-unknown-linux-gnu.tar.gz
            bin: codex
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: codex-mac-aarch64-apple-darwin.tar.gz
            bin: codex
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
      - name: Build codex-cli (release)
        shell: bash
        run: |
          export RUST_MIN_STACK=16777216
          cargo build --release --locked -p codex-cli --bin codex --target ${{ matrix.target }}
      - name: Verify binary
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.bin }} --version
      - name: Package artifact
        shell: bash
        run: |
          mkdir -p out
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a ../../../out/${{ matrix.asset }} ${{ matrix.bin }}
          else
            tar czf ../../../out/${{ matrix.asset }} ${{ matrix.bin }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: codex-rs/out/${{ matrix.asset }}
          retention-days: 14

  check:
    # fmt + clippy + fork-scoped tests on the same three platforms as `build`.
    # Independent of the release path and never touches its artifacts.
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # rust-cache keys off codex-rs/Cargo.lock (lock hash included) and only
      # writes the cache on long-lived branches; every other run just reads it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/tri-wire-api' }}
      - name: Check formatting
        shell: bash
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Clippy (fork packages)
        shell: bash
        run: cargo clippy --locked --lib -p codex-api -p codex-model-provider-info -p codex-core -- -D warnings
      - name: Test (fork packages + wiremock suites)
        shell: bash
        run: |
          export RUST_MIN_STACK=16777216
          cargo test --locked --lib -p codex-api -p codex-model-provider-info
          cargo test --locked -p codex-core --test all -- anthropic_wiremock chat_wiremock

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Publish rolling prerelease (public download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=tri-wire-test
          title="Tri-wire test build (CLI) — ${GITHUB_SHA:0:8}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" 2>/dev/null || true
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$title" \
            --notes "Test build of the tri-wire fork CLI (feat/tri-wire-api). Windows x86_64 / Linux x86_64 / macOS aarch64 (Apple Silicon). Unsigned. Report issues in this repo." \
            --prerelease \
            dist/*.zip dist/*.tar.gz
